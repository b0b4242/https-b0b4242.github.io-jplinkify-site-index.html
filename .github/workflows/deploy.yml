name: Deploy site from zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip site
        run: |
          set -e
          zipfile=$(git log --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -m1 '\.zip$')
          [ -n "$zipfile" ] || { echo "No zip found"; exit 1; }
          echo "Using: $zipfile"
          mkdir -p _unzipped _site
          unzip -q "$zipfile" -d _unzipped
          index=$(find _unzipped -name index.html -not -path '*/__MACOSX/*' | head -n 1)
          [ -n "$index" ] || { echo "No index.html found in the zip"; exit 1; }
          cp -r "$(dirname "$index")"/. _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
